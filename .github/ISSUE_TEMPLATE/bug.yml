name: Bug
description: Something in the app, the report, the editor or an export is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: And what you expected instead. }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, placeholder: "1. Open …\n2. Click …" }
  - type: input
    id: where
    attributes: { label: Where, description: "Page address, browser and device" }
